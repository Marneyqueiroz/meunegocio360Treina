spring:
  application:
    name: meunegocio360-core
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/meunegocio360_core?serverTimezone=UTC}
    username: ${DB_USER:meunegocio360}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
server:
  port: ${PORT:8080}
app:
  auth:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: meunegocio360-core
      expiracao-minutos: ${APP_AUTH_JWT_EXPIRACAO_MINUTOS:15}
    refresh:
      expiracao-dias: ${APP_AUTH_REFRESH_EXPIRACAO_DIAS:7}
    max-tentativas: ${APP_AUTH_MAX_TENTATIVAS:5}
    bloqueio-minutos: ${APP_AUTH_BLOQUEIO_MINUTOS:15}
    cookie:
      secure: ${APP_AUTH_COOKIE_SECURE:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
